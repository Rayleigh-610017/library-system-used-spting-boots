# アプリケーション名
spring.application.name=springdemodb-ALLPROJECT

# --- DB接続設定 (DBUtil.java の内容を移植) ---
# Driver（MariaDB用）
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
# 接続URL（データベース名: library_db）
spring.datasource.url=jdbc:mariadb://localhost:3306/library_db?useUnicode=true&characterEncoding=utf8
# ユーザー名とパスワード
spring.datasource.username=root
spring.datasource.password=password

# --- Spring Data JPA (Hibernate) 設定 ---
# テーブルを勝手に自動生成・削除しない（既存のDBスキーマを使用）
spring.jpa.hibernate.ddl-auto=updata

# 実行されるSQLをコンソールに出力して確認したい場合（デバッグ用）
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# 使用するSQLの方言指定
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect